<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Voxden">
  <defs>
    <linearGradient id="plate" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e22"/>
      <stop offset="55%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="rim" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">

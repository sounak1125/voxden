name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run exercises the whole pipeline -- runtime, tests, installer --
  # without publishing. The installer is kept as a workflow artifact instead.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22: the account service and its tests use node:sqlite (22.5+).
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the public sign-in service before a release
        if: github.event_name == 'push'
        run: npm run check:account-service

      - name: Setup Python for the bundled speech runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Prepare the complete speech runtime
        run: npm run prepare:asr-runtime

      - name: Validate app and speech lifecycle
        env:
          VOXDEN_PYTHON: ${{ github.workspace }}\dist-runtime-v3\runtime\python.exe
        run: npm test

      - name: Validate speech setup UI
        run: npm run test:speech-ui

      - name: Validate music controls UI
        run: npm run test:media-ui

      - name: Validate the flow bar overlay
        run: npm run test:flow-bar-ui

      - name: Validate flow bar placement and dragging
        run: npm run test:flow-bar-main

      - name: Validate the notifications panel
        run: npm run test:notifications-ui

      - name: Validate packaged startup without installed models
        run: npm run test:packaged-startup

      - name: Validate sign-in server persistence before authentication
        run: npm run test:account-service-native

      # The draft's body comes from release-notes/current.md (build.releaseInfo
      # in package.json). Rewrite that file for the new version before tagging.
      - name: Build and publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Build without publishing
        if: github.event_name == 'workflow_dispatch'
        run: npm run dist

      - name: Keep the installer from a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Voxden-Setup
          path: |
            dist/Voxden-Setup-*.exe
            dist/Voxden-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  # The macOS build is unsigned and arm64 only. A manual run builds it and runs
  # the tests so the port can be watched, and that is all it does until Apple
  # Developer signing lands. The Windows job above is untouched, so a tag push
  # still builds Windows only.
  mac:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Keeps electron-builder from looking for a signing identity in the
      # runner keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The test chain is && joined, so one Windows-only failure would hide
      # everything after it. The report runs each file on its own and never
      # fails the job yet.
      - name: Run the test chain file by file (informational until the macOS port lands)
        run: node scripts/test-report.js --skip test-win32,test-win32-protocol,test-tray,test-packaged-sidecar,test-qwen-packaged,test-release-safety
        continue-on-error: true

      - name: Build the unsigned macOS app
        run: npm run dist:mac

      - name: Keep the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: Voxden-mac
          path: |
            dist/Voxden-*-mac-*.zip
            dist/Voxden-*-mac-*.dmg
            dist/latest-mac.yml
          if-no-files-found: error

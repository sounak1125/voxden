name: Desktop checks

# A branch with an open pull request is covered by pull_request alone. Also
# triggering on its pushes ran the whole matrix twice per commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed by event and pull request number, never by branch name: a fork's
# branch called "main" must not share a group with pushes to main, and a
# push must not cancel the pull_request run for the same commit. Only
# superseded pull request runs are cancelled; every push to main keeps its own.
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Keep a separate native Sonoma run while GitHub still offers it:
        # macos-14 is ARM64 and scheduled to retire on 2026-11-02.
        # https://github.com/actions/runner-images/issues/13518
        os: [windows-latest, macos-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Build the Windows speech runtime
        id: runtime_windows
        if: runner.os == 'Windows'
        run: |
          npm run prepare:asr-runtime
          "VOXDEN_PYTHON=$env:GITHUB_WORKSPACE/dist-runtime-v3/runtime/python.exe" >> $env:GITHUB_ENV
      - name: Build the Apple silicon speech runtime
        id: runtime_mac
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run prepare:asr-runtime
          mkdir -p dist-test-report
          cp dist-runtime-v3/mac-native-compatibility.json dist-test-report/mac-runtime-native-compatibility.json
          echo "VOXDEN_PYTHON=$GITHUB_WORKSPACE/dist-runtime-v3/runtime/bin/python3.12" >> "$GITHUB_ENV"
      - name: App and speech regressions
        run: node scripts/test-report.js --strict --json dist-test-report/results.json
      - name: Real Parakeet V3 speech on Windows
        if: runner.os == 'Windows'
        run: node scripts/test-parakeet-inference.js --expect-platform win32 --expect-arch x64 --json dist-test-report/parakeet.json
      - name: Real Parakeet V3 speech on Apple silicon
        if: runner.os == 'macOS'
        run: node scripts/test-parakeet-inference.js --expect-platform darwin --expect-arch arm64 ${{ matrix.os == 'macos-14' && '--expect-os-major 14' || '' }} --json dist-test-report/parakeet.json
      - name: Extended desktop, synthetic recording and UI regressions
        run: node scripts/test-desktop-readiness.js
      - name: Preserve desktop results before packaging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-${{ matrix.os }}
          path: dist-test-report/desktop-readiness
          if-no-files-found: warn
      - name: Package the Windows app without publishing
        id: package_windows
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.runtime_windows.outcome == 'success' }}
        run: npm run dist
      - name: Package the Apple silicon app without publishing
        id: package_mac
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.runtime_mac.outcome == 'success' }}
        run: npm run dist:mac
      - name: Verify the packaged Mac signature
        if: ${{ !cancelled() && steps.package_mac.outcome == 'success' }}
        run: codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Voxden.app
      - name: Windows packaged startup and existing profile
        if: ${{ !cancelled() && steps.package_windows.outcome == 'success' }}
        env:
          VOXDEN_BUILD_OUTPUT: dist
        run: |
          node scripts/test-qwen-packaged.js
          node scripts/test-packaged-sidecar.js
          npx --no-install electron scripts/test-packaged-startup.js --resources=dist/win-unpacked/resources
          npx --no-install electron scripts/test-packaged-startup.js --resources=dist/win-unpacked/resources --existing-profile
      - name: Mac packaged startup and existing profile
        if: ${{ !cancelled() && steps.package_mac.outcome == 'success' }}
        run: |
          npx --no-install electron scripts/test-packaged-startup.js --resources=dist/mac-arm64/Voxden.app/Contents/Resources
          npx --no-install electron scripts/test-packaged-startup.js --resources=dist/mac-arm64/Voxden.app/Contents/Resources --existing-profile
      - name: Launch the actual signed Mac bundle
        if: ${{ !cancelled() && steps.package_mac.outcome == 'success' }}
        run: node scripts/smoke-mac-app.js --app dist/mac-arm64/Voxden.app --log dist-test-report/mac-bundle-smoke.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-checks-${{ matrix.os }}
          path: dist-test-report
          if-no-files-found: warn
  native_credentials:
    # Keychain qualification does not need a multi-gigabyte speech runtime.
    # Report it early and independently of the full desktop/package matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without building the 7-Zip extractor
        # Only packaging and the speech runtime need it; this job needs neither.
        env:
          VOXDEN_SKIP_PACK_TOOLS: '1'
        run: npm ci
      - name: Native Mac credential compatibility
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p dist-test-report
          node scripts/test-account-storage-native.js 2>&1 | tee dist-test-report/native-storage.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-credentials-${{ matrix.os }}
          path: dist-test-report/native-storage.log
          if-no-files-found: warn
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r training/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s training -p 'test_*.py' -v

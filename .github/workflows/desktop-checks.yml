name: Desktop checks

on:
  pull_request:
  push:
    branches: [main, 'fix/**']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Build the Windows speech runtime
        id: runtime_windows
        if: runner.os == 'Windows'
        run: |
          npm run prepare:asr-runtime
          "VOXDEN_PYTHON=$env:GITHUB_WORKSPACE/dist-runtime-v3/runtime/python.exe" >> $env:GITHUB_ENV
      - name: Build the Apple silicon speech runtime
        id: runtime_mac
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run prepare:asr-runtime
          echo "VOXDEN_PYTHON=$GITHUB_WORKSPACE/dist-runtime-v3/runtime/bin/python3.12" >> "$GITHUB_ENV"
      - name: App and speech regressions
        run: node scripts/test-report.js --strict --json dist-test-report/results.json
      - name: Real Parakeet V3 speech on Windows
        if: runner.os == 'Windows'
        run: node scripts/test-parakeet-inference.js --expect-platform win32 --expect-arch x64 --json dist-test-report/parakeet.json
      - name: Real Parakeet V3 speech on Apple silicon
        if: runner.os == 'macOS'
        run: node scripts/test-parakeet-inference.js --expect-platform darwin --expect-arch arm64 --json dist-test-report/parakeet.json
      - name: Extended desktop, synthetic recording and UI regressions
        run: node scripts/test-desktop-readiness.js
      - name: Package the Windows app without publishing
        id: package_windows
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.runtime_windows.outcome == 'success' }}
        run: npm run dist
      - name: Package the Apple silicon app without publishing
        id: package_mac
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.runtime_mac.outcome == 'success' }}
        run: npm run dist:mac
      - name: Verify the packaged Mac signature
        if: ${{ !cancelled() && steps.package_mac.outcome == 'success' }}
        run: codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Voxden.app
      - name: Windows packaged startup and existing profile
        if: ${{ !cancelled() && steps.package_windows.outcome == 'success' }}
        env:
          VOXDEN_BUILD_OUTPUT: dist
        run: |
          node scripts/test-qwen-packaged.js
          node scripts/test-packaged-sidecar.js
          npx --no-install electron scripts/test-packaged-startup.js --resources=dist/win-unpacked/resources
          npx --no-install electron scripts/test-packaged-startup.js --resources=dist/win-unpacked/resources --existing-profile
      - name: Mac packaged startup and existing profile
        if: ${{ !cancelled() && steps.package_mac.outcome == 'success' }}
        run: |
          npx --no-install electron scripts/test-packaged-startup.js --resources=dist/mac-arm64/Voxden.app/Contents/Resources
          npx --no-install electron scripts/test-packaged-startup.js --resources=dist/mac-arm64/Voxden.app/Contents/Resources --existing-profile
      - name: Launch the actual signed Mac bundle
        if: ${{ !cancelled() && steps.package_mac.outcome == 'success' }}
        run: node scripts/smoke-mac-app.js --app dist/mac-arm64/Voxden.app --log dist-test-report/mac-bundle-smoke.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-checks-${{ matrix.os }}
          path: dist-test-report
          if-no-files-found: warn
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: python -m pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r training/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s training -p 'test_*.py' -v

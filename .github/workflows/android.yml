name: Android beta APK

# Builds the sideloadable beta APK of Voxden for Android (com.voxden.android.beta),
# runs the JVM unit tests and lint, and keeps the APK as a run artifact.
#
# The beta variant is release code signed with the Gradle debug key. On a CI
# runner that key is generated fresh for every run, so a new build cannot be
# installed over an older one: uninstall the previous beta first. It is a test
# build, not a Play Store artifact.
#
# Nothing here has secrets, pushes, or publishes a release.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the Gradle wrapper jar
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # gradlew is committed without its executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the beta APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleBeta

      # Uploaded before the checks so a lint or test failure never hides the build.
      - name: Upload the beta APK
        uses: actions/upload-artifact@v7
        with:
          name: voxden-android-beta
          path: android/app/build/outputs/apk/beta/app-beta.apk
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voxden-android-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

name: Account service

# Test the account service and publish its container image whenever it
# changes on main. deploy/docker-compose.yml pulls the result.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/test-account*.js'
      - 'scripts/test-cloud-relay.js'
      - 'scripts/test-billing.js'
      - 'scripts/smoke-account-service.js'
      - '.github/workflows/account-service.yml'
  pull_request:
    paths:
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Service tests
        run: |
          node scripts/test-account.js
          node --no-warnings scripts/test-account-mail.js
          node scripts/test-account-service.js
          node --no-warnings scripts/test-account-server.js
          node --no-warnings scripts/test-cloud-relay.js
          node --no-warnings scripts/test-billing.js
          node --no-warnings scripts/smoke-account-service.js

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/voxden-account:latest
            ghcr.io/${{ github.repository_owner }}/voxden-account:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
